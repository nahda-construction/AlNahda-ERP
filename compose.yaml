x-erp-app: &erp-app
  image: ${COMPOSE_PROJECT_NAME}-erp-app
  build: .

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${ERP_DB_NAME:?Set ERP_DB_NAME in the external environment file}
      POSTGRES_USER: ${ERP_DB_USER:?Set ERP_DB_USER in the external environment file}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD in the external environment file}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    <<: *erp-app
    environment:
      DJANGO_SECRET_KEY: ${ERP_DJANGO_SECRET_KEY:?Set ERP_DJANGO_SECRET_KEY in the external environment file}
      POSTGRES_DB: ${ERP_DB_NAME:?Set ERP_DB_NAME in the external environment file}
      POSTGRES_USER: ${ERP_WEB_DB_USER:?Set ERP_WEB_DB_USER in the external environment file}
      POSTGRES_PASSWORD: ${ERP_WEB_DB_PASSWORD:?Set ERP_WEB_DB_PASSWORD in the external environment file}
      POSTGRES_HOST: db
      ERP_PRIVATE_ROOT: /var/lib/erp/private
      ERP_PRINT_URL: http://printer:8010/render
      GUNICORN_CMD_ARGS: --workers ${ERP_WEB_WORKERS:-2} --timeout 45
    volumes:
      - privatefiles:/var/lib/erp/private
    ports:
      - "127.0.0.1:${ERP_WEB_PORT:?Set ERP_WEB_PORT in the external environment file}:8000"
    networks:
      - frontend
      - database
      - printing
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  printer:
    <<: *erp-app
    command: ["python", "-m", "apps.printing.worker"]
    mem_limit: ${ERP_PRINT_MEMORY_LIMIT:-1g}
    shm_size: 256m
    restart: on-failure
    stop_grace_period: 10s
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - printlock:/var/lib/erp/print
    networks:
      - printing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz/', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [maintenance]
    <<: *erp-app
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SECRET_KEY: ${ERP_DJANGO_SECRET_KEY:?Set ERP_DJANGO_SECRET_KEY in the external environment file}
      POSTGRES_DB: ${ERP_DB_NAME:?Set ERP_DB_NAME in the external environment file}
      POSTGRES_USER: ${ERP_DB_USER:?Set ERP_DB_USER in the external environment file}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD in the external environment file}
      POSTGRES_HOST: db
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  privatefiles:
  printlock:

networks:
  frontend:
  database:
    internal: true
  printing:
    internal: true
