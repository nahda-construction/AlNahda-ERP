name: Review Tooling

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reviewer-tooling:
    name: Reviewer tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate review runner syntax
        run: bash -n ops/review-pr.sh
      - name: Test merge preflight policy
        run: python3 -m unittest discover -s tests -p 'test_merge_preflight.py' -v
