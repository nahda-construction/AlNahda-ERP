name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgresql:
    name: PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: erp_ci
      POSTGRES_USER: erp_ci
      POSTGRES_PASSWORD: ci-only
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U erp_ci -d erp_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git changes for secrets
        env:
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/ci/scan-secrets.sh ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify PostgreSQL version
        run: |
          python manage.py shell -c '
          from django.db import connection
          connection.ensure_connection()
          version = connection.pg_version
          if version // 10000 != 18:
              raise SystemExit(f"Expected PostgreSQL 18, got server_version_num={version}")
          print(f"PostgreSQL server_version_num={version}")
          '
      - name: Validate and apply migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Run Django tests
        run: python manage.py test

  printer-cgroup:
    name: S1-10 printer cgroup acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PDF inspection tools if needed
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Verify printer cgroup OOM and recovery
        run: bash tests/run_s1_10_cgroup_acceptance.sh

  staging-acceptance:
    name: S1-12 automated Staging acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure certificate tooling is available
        run: |
          if ! command -v certutil >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libnss3-tools poppler-utils
          fi
      - name: Verify isolated cleanup lifecycle
        run: bash tests/run_s1_12_acceptance.sh --lifecycle-check
      - name: Run isolated Staging acceptance
        run: |
          export S1_12_EVIDENCE_DIR="$RUNNER_TEMP/s112-evidence"
          bash tests/run_s1_12_acceptance.sh --run-pointer "$RUNNER_TEMP/s112-run-pointer"
      - name: Verify test resource cleanup
        if: always()
        run: bash tests/run_s1_12_acceptance.sh --cleanup "$RUNNER_TEMP/s112-run-pointer"
      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s1-12-browser-evidence
          path: ${{ runner.temp }}/s112-evidence
          if-no-files-found: ignore

  backup-restore:
    name: S1-13 synthetic backup and restore acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure native Restic is available
        run: |
          if ! command -v restic >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends restic
          fi
          restic version
      - name: Verify synthetic backup, transfer and recovery
        run: python3 -m unittest -v tests.test_s1_13_backup
