<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاملة تجريبية جديدة</title>
</head>
<body>
  <main>
    <nav><a href="{% url 'test_transactions:project' project.id %}">{{ project.name }}</a></nav>
    <h1>معاملة تجريبية جديدة</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <fieldset>
        <legend>سطور المعاملة</legend>
        {{ line_forms.management_form }}
        {{ line_forms.non_form_errors }}
        <div id="transaction-lines">
          {% for line in line_forms %}
            <fieldset>{{ line.as_p }}</fieldset>
          {% endfor %}
        </div>
        <template id="line-template"><fieldset>{{ line_forms.empty_form.as_p }}</fieldset></template>
        <button type="button" id="add-line" data-max-lines="{{ max_lines }}">إضافة سطر</button>
      </fieldset>
      <button type="submit">حفظ المسودة</button>
      <p id="transaction-save-status" role="alert" hidden></p>
    </form>
  </main>
  <script>
    const lineCount = document.getElementById('id_lines-TOTAL_FORMS');
    const addLine = document.getElementById('add-line');
    const lineTemplate = document.getElementById('line-template');
    const lines = document.getElementById('transaction-lines');
    const maxLines = Number(addLine.dataset.maxLines);

    addLine.disabled = Number(lineCount.value) >= maxLines;
    addLine.addEventListener('click', () => {
      const index = Number(lineCount.value);
      if (index >= maxLines) return;
      lines.insertAdjacentHTML('beforeend', lineTemplate.innerHTML.replaceAll('__prefix__', index));
      lineCount.value = index + 1;
      addLine.disabled = index + 1 >= maxLines;
    });

    const transactionForm = addLine.form;
    const submitButton = transactionForm.querySelector('button[type="submit"]');
    const saveStatus = document.getElementById('transaction-save-status');
    const unconfirmedSave = 'تعذّر تأكيد الحفظ. أعد المحاولة بالبيانات نفسها بعد عودة الاتصال. إذا لزم الأمر، اختر المرفق نفسه.';
    const detailPrefix = new URL('../', transactionForm.action).pathname;
    let saving = false;

    transactionForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (saving) return;

      saving = true;
      submitButton.disabled = true;
      saveStatus.textContent = '';
      saveStatus.hidden = true;

      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 60000);

      try {
        const response = await fetch(transactionForm.action, {
          method: 'POST',
          body: new FormData(transactionForm),
          mode: 'same-origin',
          signal: controller.signal,
        });

        if (response.redirected && response.ok) {
          const destination = new URL(response.url);
          const transactionId = destination.pathname.slice(detailPrefix.length);
          if (destination.origin === window.location.origin &&
              destination.pathname.startsWith(detailPrefix) &&
              /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\/$/.test(transactionId)) {
            window.location.assign(destination.href);
            return;
          }
          saveStatus.textContent = 'تعذّر تأكيد الحفظ. تحقق من الجلسة ثم أعد المحاولة بالبيانات نفسها.';
        } else if (response.status === 400 || response.status === 409) {
          const errorPage = new DOMParser().parseFromString(await response.text(), 'text/html');
          const messages = Array.from(errorPage.querySelectorAll('.errorlist li'), item => item.textContent);
          saveStatus.textContent = messages.join('، ') || errorPage.body.textContent.trim() || unconfirmedSave;
        } else if (response.status === 403) {
          saveStatus.textContent = 'رُفض الطلب. تحقق من الجلسة وصلاحية الحفظ.';
        } else {
          saveStatus.textContent = unconfirmedSave;
        }
      } catch {
        saveStatus.textContent = unconfirmedSave;
      } finally {
        window.clearTimeout(timeout);
      }

      saveStatus.hidden = false;
      submitButton.disabled = false;
      saving = false;
    });
  </script>
</body>
</html>
